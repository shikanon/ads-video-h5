<script>
(() => {
const root=document.getElementById('lightmao-0212');
const media=__LIGHTMAO_DEMO_MEDIA__;
const ic=(name)=>`<i data-lucide="${name}" aria-hidden="true"></i>`;
const esc=(s)=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const templateList=[{id:'lightmao',name:'轻喵表情',sub:'画风稳定',icon:'cat',prompt:'用这张角色图制作日常表情，先比较两种轻喵画风。'},{id:'cut',name:'素材精剪',sub:'提供自己的素材',icon:'scissors',prompt:'把我上传的素材剪成20秒短片，保留原声，配字幕。'},{id:'knowledge',name:'知识图解',sub:'主题变作品',icon:'lightbulb',prompt:'帮我把这个知识点做成图解，先整理结构。'}];
const styleName=(s)=>s==='soft'?'柔彩精致':'圆润萌系';
const saved=window.openai?.widgetState?.privateContent || {};
const all=[];
root.querySelectorAll('.lm-phone').forEach((phone,index)=>{
 const layout=phone.dataset.layout;
 const state={page:'create',stage:'styles',style:null,output:'static',template:'lightmao',shelf:true,sheet:null,zoom:1,pan:{x:0,y:0},focus:0,prompt:'',message:'',chatMessage:'',freeChat:false,check:'good',expanded:false,projectDrafts:{},...(saved[layout]||{}),toast:''};
 state.sheet=null;state.toast='';
 const demo={radius:16,templatePanel:true};
 const store=()=>{const p={};all.forEach(a=>{const {page,stage,style,output,template,shelf,prompt,freeChat,projectDrafts}=a.state;p[a.layout]={page,stage,style,output,template,shelf,prompt,freeChat,projectDrafts};});window.openai?.setWidgetState?.({modelContent:{prototype:'lightmao-0.2.12',layout,selectedStyle:state.style,stage:state.stage},privateContent:p}).catch(()=>{});};
 const stashCurrent=()=>{const {stage,style,output,focus,zoom,pan,prompt,message}=state;state.projectDrafts[state.template]={stage,style,output,focus,zoom,pan:{...pan},prompt,message};};
 all.push({layout,state});
 const current=()=>media[state.style==='soft'?'soft':'round'];
 const toast=(text)=>{state.toast=text;render();setTimeout(()=>{state.toast='';render();},2400);};
 const stageLabel=()=>({styles:'选择画风',ready:'补充制作要求',samples:'确认3张样张',batch:'整套制作中',complete:'24张表情已完成'}[state.stage]||'当前作品');
 const candidates=()=>`<div class="lm-candidate-row">${['soft','round'].map(s=>`<button class="lm-candidate" data-action="style" data-value="${s}" aria-pressed="${state.style===s}" aria-label="选择${styleName(s)}画风"><span class="lm-selected">✓</span><img src="${media[s]}" alt="${styleName(s)}的同一角色画风候选" draggable="false"><span class="lm-name">${styleName(s)}</span><span class="lm-sub">${s==='soft'?'比例舒展 · 细节柔和':'圆脸大眼 · 更有萌感'}</span></button>`).join('')}</div>`;
 const canvas=()=>{
 if(state.freeChat)return `<div class="lm-story"><div class="lm-agent-name"><span class="lm-avatar">${ic('cat')}</span>轻喵</div><div class="lm-bubble">我在呢。想聊点什么？你也可以随时把聊到的想法放进画布。</div>${state.chatMessage?`<div class="lm-bubble lm-user">${esc(state.chatMessage)}</div><div class="lm-bubble">好呀，我们就接着这个想法聊。<div class="lm-sub">此处为对话布局演示</div></div>`:''}<button class="lm-link" data-action="returncanvas">${ic('panels-top-left')}带着上下文进入画布</button></div>`;
 if(state.template!=='lightmao')return `<div class="lm-stage"><div class="lm-stagehead"><span>${state.template==='cut'?'素材精剪':'知识图解'}</span><span>输入 → 制作 → 导出</span></div><div class="lm-blank">${ic(state.template==='cut'?'clapperboard':'lightbulb')}<strong>${state.stage==='ready'?'把创作要求带进来':'制作需求已整理'}</strong><p>${state.template==='cut'?'添加你自己的片段，再描述希望保留什么。':'输入一个知识点，轻喵帮你组织成清晰的图解。'}</p><button class="lm-link" data-action="attach">${ic('plus')}添加素材或文档</button></div></div>`;
 if(state.stage==='styles')return `<div class="${layout==='chat'?'lm-chat-candidates':'lm-stage'}"><div class="lm-stagehead"><span>你的角色 · 两种画风</span><span>点选一种</span></div>${candidates()}<div class="lm-canvas-foot"><button class="lm-link" data-action="reference">${ic('image')}参考图已检查</button><span>源自轻喵24张表情</span></div></div>`;
 if(state.stage==='ready')return `<div class="lm-stage"><div class="lm-blank">${ic('image-plus')}<strong>先放入你的角色图</strong><p>清晰、主体完整、能辨认角色特征。<br>轻喵会先检查，再制作两种画风。</p><button class="lm-link" data-action="reference">使用示例角色体验 →</button></div></div>`;
 if(state.stage==='samples')return `<div class="lm-stage"><div class="lm-stagehead"><span>样张 · ${state.focus+1}/3</span><span class="lm-lock">${ic('lock-keyhole')}${styleName(state.style)}已锁定</span></div><div class="lm-object lm-dotgrid"><img src="${state.style==='soft'?media['sample'+state.focus]:current()}" alt="当前画风的${['贴贴','摸摸头','心动'][state.focus]}样张示意" style="transform:translate(${state.pan.x}px,${state.pan.y}px) scale(${state.zoom})" draggable="false" data-draggable="true"></div><div class="lm-canvas-foot"><div class="lm-tools"><button data-action="zoomout" aria-label="缩小画布">−</button><span>${Math.round(state.zoom*100)}%</span><button data-action="zoomin" aria-label="放大画布">＋</button><button data-action="fit" aria-label="适应画布">${ic('maximize')}</button></div><button class="lm-link" data-action="reference">${ic('image')}参考图</button></div><div class="lm-choice-row" style="margin:0 10px 10px">${['贴贴','摸摸头','心动'].map((x,i)=>`<button data-action="sample" data-value="${i}" aria-pressed="${state.focus===i}">${x}</button>`).join('')}</div>${state.style==='round'?'<div class="lm-media-note">圆润画风示意，真实动作以实际生成为准</div>':''}</div>`;
 if(state.stage==='batch')return `<div class="lm-stage"><div class="lm-stagehead"><span>继续完成剩余21张</span><span class="lm-lock">${ic('lock-keyhole')}${styleName(state.style)}</span></div><div class="lm-object"><img src="${current()}" alt="锁定画风的角色"></div><div style="padding:0 14px 14px"><div class="lm-progress"><span></span></div><div class="lm-sub">演示进度 · 已保留确认的3张样张</div></div></div>`;

 const primary=()=>{

 if(state.stage==='samples')return `<button class="lm-primary" data-action="confirmbatch">确认样张，继续剩余21张 <small>· 2520积分</small>${ic('arrow-right')}</button><div class="lm-action-note">沿用当前画风和3张样张，不重复制作</div>`;

 return `<button class="lm-primary" data-action="reference">检查参考图，再制作画风 <small>· 240积分</small></button><div class="lm-action-note">两种候选画风，仅在图片可用后制作</div>`;

 const sheet=()=>{
 if(!state.sheet)return '';

 } else if(state.sheet==='settings'){

 } else if(state.sheet==='attach'){
 title='给轻喵添加素材';content=`<button class="lm-option" data-action="reference"><span>图片 / 拍摄<small>作为当前项目的角色图或参考图</small></span>${ic('image-plus')}</button><button class="lm-option" data-action="filedemo"><span>Word / 文本 / PDF<small>先显示解析结果，再附加到对话</small></span>${ic('file-text')}</button><button class="lm-option" data-action="filedemo"><span>我的素材<small>选择已有素材，保留在当前输入中</small></span>${ic('folder-open')}</button><button class="lm-option" data-action="voicedemo"><span>语音输入</span>${ic('mic')}</button>`;
 } else if(state.sheet==='templates'){
 title='制作模板';content=`<p>模板带入要求，由你确认后开始制作。</p>${templateList.map(t=>`<button class="lm-option" data-action="template" data-value="${t.id}"><span><strong>${t.name}</strong><small>${t.id==='lightmao'?'参考轻喵24张表情 → 两种画风 → 样张 → 整套':t.sub}</small></span>${ic(t.icon)}</button>`).join('')}`;
 } else if(state.sheet==='history'){
 title='项目与对话';content=`<button class="lm-option" data-action="resume"><span>角色的日常心情<small>${stageLabel()} · 已保存当前选择</small></span>${ic('arrow-up-right')}</button><button class="lm-option" data-action="new"><span>新建制作项目</span>${ic('plus')}</button><button class="lm-option" data-action="freechat"><span>和轻喵聊聊<small>保留独立对话，随时转入制作</small></span>${ic('messages-square')}</button>`;
 } else if(state.sheet==='batchconfirm'){
 title='继续制作整套';content=`<div class="lm-check"><b>${ic('lock-keyhole')}${styleName(state.style)} · 本套统一使用</b><p>已确认的3张直接复用；只继续其余21张。<br>输出：${state.output==='static'?'静态透明 PNG':'动态表情'}。</p></div><p>本阶段2520积分。真实提交前会校验余额；已完成部分保留，续作只计算未完成部分。</p><button class="lm-primary" data-action="startbatch">确认继续 · 2520积分</button><p style="text-align:center;margin-top:8px">当前为交互原型，不执行真实扣费</p>`;
 } else if(state.sheet==='export'){
 title='导出作品';content=`<button class="lm-option" data-action="exportdemo"><span>保存表情包<small>${state.output==='static'?'24张透明PNG，打包下载':'GIF / WebP / APNG 与静态PNG'}</small></span>${ic('download')}</button><button class="lm-option" data-action="exportdemo"><span>分享自己的作品<small>只分享你选择公开的这份作品</small></span>${ic('share-2')}</button><p>交互演示，不会下载文件或发送给好友。</p>`;
 }
 return `<div class="lm-overlay" data-action="dismiss"><section class="lm-sheet" role="dialog" aria-modal="true" aria-label="${title}"><div class="lm-handle"></div><div class="lm-sheethead">${title}<button class="lm-icon" data-action="closesheet" aria-label="关闭面板">${ic('x')}</button></div>${content}</section></div>`;
 };
 const tabs=()=>`<nav class="lm-tabs" aria-label="底部导航">${[['create','panels-top-left','创作'],['works','folder-open','作品'],['profile','user-round','我的']].map(([p,i,n])=>`<button class="lm-tab" data-action="page" data-value="${p}" ${state.page===p?'aria-current="page"':''}>${ic(i)}<span>${n}</span></button>`).join('')}</nav><div class="lm-homebar"></div>`;
 function render(){
 const agent=`<div class="lm-agent"><div class="lm-agent-name"><span class="lm-avatar">${ic('cat')}</span>轻喵<span class="lm-sub">${state.freeChat?'和你聊聊':'帮你完成当前这一步'}</span></div><div class="lm-agent-message" aria-live="polite">${agentMessage()}</div></div>`;
 const project=`<div class="lm-projectbar"><button class="lm-icon" data-action="history" aria-label="项目与对话">${ic('panel-left')}</button><div class="lm-project-title">${state.freeChat?'和轻喵聊聊':state.template==='lightmao'?'角色的日常心情':state.template==='cut'?'我的素材精剪':'知识图解'}<div class="lm-save"><i></i>${state.freeChat?'独立会话':'草稿已保存 · 当前项目'}</div></div><button class="lm-icon" data-action="settings" aria-label="项目设置">${ic('sliders-horizontal')}</button></div>`;
 let body='';
 if(state.page==='create')body=`${project}<div class="lm-typebar"><div class="lm-segment"><button data-action="returncanvas" aria-pressed="${!state.freeChat}">画布</button><button data-action="freechat" aria-pressed="${state.freeChat}">聊聊</button></div>${!state.freeChat?`<button class="lm-link" data-action="settings">${state.output==='static'?'静态 PNG':'动态表情'} ${ic('chevron-down')}</button>`:''}</div>${layout==='chat'&&!state.freeChat?agent:''}${canvas()}${layout==='canvas'||state.freeChat?agent:''}<div class="lm-action">${primary()}</div><div class="lm-compose"><div class="lm-context">${ic(state.freeChat?'messages-square':'mouse-pointer-2')}<span>${state.freeChat?'当前对话':state.template==='lightmao'?'轻喵表情模板'+(state.style?' · '+styleName(state.style):' · 画风待选'):templateList.find(t=>t.id===state.template).name+'模板'}</span></div><div class="lm-inputrow"><button class="lm-icon" data-action="attach" aria-label="添加素材、文件或语音">${ic('plus')}</button><textarea class="lm-input" data-input="prompt" aria-label="向轻喵描述制作要求" placeholder="${state.freeChat?'和轻喵聊聊…':'描述想改哪里，或补充制作要求…'}">${esc(state.prompt)}</textarea><button class="lm-send" data-action="send" aria-label="发送要求">${ic('arrow-up')}</button></div></div><div class="lm-templatebar"><div class="lm-shelf-title"><button data-action="templates">${ic('layout-template')}模板</button><button data-action="shelf">${state.shelf?'收起':'展开'} ${ic(state.shelf?'chevron-down':'chevron-up')}</button></div>${state.shelf?`<div class="lm-templates">${templateList.map(t=>`<button class="lm-template" data-action="template" data-value="${t.id}" aria-pressed="${state.template===t.id}">${ic(t.icon)}<span>${t.name}<small>${t.sub}</small></span></button>`).join('')}</div>`:''}</div>`;
 else if(state.page==='works')body=`<div class="lm-page"><h2>我的作品</h2><div class="lm-sub">每次创作，一个项目。随时回来继续。</div><div class="lm-choice-row"><button aria-pressed="true" data-action="worksprojects">项目</button><button aria-pressed="false" data-action="attach">素材</button></div><button class="lm-projectcard" data-action="resume"><div class="lm-project-cover"><img src="${current()}" alt="当前项目角色"></div><div class="lm-projectcopy"><strong>角色的日常心情</strong><small>${state.style?styleName(state.style)+' · ':''}${stageLabel()}<br>选中画风、素材和进度都在这里</small><div class="lm-link">继续这个项目 ${ic('arrow-up-right')}</div></div></button><button class="lm-option" data-action="new"><span>开始新的创作</span>${ic('plus')}</button></div>`;
 else body=`<div class="lm-page"><div class="lm-profile"><span class="lm-avatar">${ic('cat')}</span><strong>轻喵创作者</strong><div class="lm-sub">让每个想法，都有自己的样子</div></div><button class="lm-option" data-action="creditsdemo"><span>我的积分<small>查看余额与每笔使用记录</small></span>${ic('chevron-right')}</button><button class="lm-option" data-action="history"><span>项目与对话</span>${ic('chevron-right')}</button><button class="lm-option" data-action="settings"><span>偏好设置</span>${ic('chevron-right')}</button><button class="lm-option" data-action="helpdemo"><span>帮助与反馈</span>${ic('chevron-right')}</button><div class="lm-sub" style="margin-top:28px;text-align:center">0.2.12 交互原型 · 不扣积分</div></div>`;
 phone.innerHTML=`<div class="lm-status"><span>9:41</span><span>0.2.12 原型 · 不扣积分</span></div><header class="lm-nav"><div class="lm-brand">${ic('cat')}轻喵 <span style="font-size:10px;opacity:.8">LightMao</span></div><div class="lm-capsule" aria-hidden="true">•••<span></span>◉</div></header>${body}${tabs()}${sheet()}${state.toast?`<div class="lm-toast" role="status">${esc(state.toast)}</div>`:''}`;
 if(globalThis.lucide)lucide.createIcons({attrs:{width:18,height:18}});
 }
 phone.addEventListener('click',e=>{
 const b=e.target.closest('[data-action]');if(!b)return;
 const a=b.dataset.action,v=b.dataset.value;if(a==='dismiss'&&e.target!==b)return;
 switch(a){
 case 'style':state.style=v;state.message='';break;
 case 'generate':if(!state.style)return;state.stage='samples';state.focus=0;state.zoom=1;state.message='';break;
 case 'confirmbatch':state.sheet='batchconfirm';break;
 case 'startbatch':state.stage='batch';state.sheet=null;state.message='';break;
 case 'complete':state.stage='complete';break;
 case 'sample':state.focus=Number(v);state.zoom=1;state.pan={x:0,y:0};break;
 case 'zoomin':state.zoom=Math.min(2,state.zoom+.25);break;
 case 'zoomout':state.zoom=Math.max(.5,state.zoom-.25);break;
 case 'fit':state.zoom=1;state.pan={x:0,y:0};break;
 case 'reference':state.sheet='reference';break;
 case 'check':state.check=v;break;
 case 'replace':state.check='good';return toast('示例换图：已切换为清晰单角色图，请再次检查。');
 case 'startstyles':state.stage='styles';state.style=null;state.template='lightmao';state.sheet=null;state.freeChat=false;state.message='';break;
 case 'settings':case 'attach':case 'templates':case 'history':case 'export':state.sheet=a;break;
 case 'dismiss':case 'closesheet':state.sheet=null;break;
 case 'output':state.output=v;break;
 case 'shelf':state.shelf=!state.shelf;break;
 case 'page':state.page=v;state.sheet=null;break;
 case 'resume':state.page='create';state.sheet=null;break;
 case 'new':state.stage='ready';state.style=null;state.page='create';state.template='lightmao';state.freeChat=false;state.sheet=null;state.message='';state.prompt='';break;
 case 'freechat':state.freeChat=true;state.sheet=null;state.page='create';break;
 case 'returncanvas':state.freeChat=false;state.sheet=null;break;
 case 'template':{stashCurrent();state.template=v;const previous=state.projectDrafts[v];Object.assign(state,previous||{stage:'ready',style:null,focus:0,zoom:1,pan:{x:0,y:0},prompt:templateList.find(t=>t.id===v).prompt,message:'模板已选好，你可以修改输入框中的要求，再开始制作。'});state.freeChat=false;state.sheet=null;state.shelf=false;break;}
 case 'send':{const input=phone.querySelector('[data-input=prompt]');const value=(input?.value||state.prompt).trim();if(!value)return toast('先输入想法，或点选一个画风。');if(state.freeChat)state.chatMessage=value;else state.message='收到：「'+value+'」。这条要求会应用到当前项目；原型仅展示交互，不会发起生成。';state.prompt='';state.shelf=false;break;}
 case 'toolstart':state.message='制作方案已整理。真实制作前会核对素材、展示预计积分，并由你确认。';break;
 case 'filedemo':state.sheet=null;state.prompt='请阅读我附加的文档，结合当前项目帮我梳理要求。';return toast('文件入口演示：实际版本会先解析，再显示为待发送附件。');
 case 'voicedemo':return toast('语音入口演示，不会打开麦克风。');
 case 'exportdemo':return toast('导出流程演示，不下载文件或发送分享。');
 case 'creditsdemo':return toast('这里查看真实余额与流水，原型不会扣积分。');
 case 'worksprojects':return toast('当前展示按项目归档的作品。');
 case 'helpdemo':return toast('帮助入口：参考图建议、费用说明与问题反馈。');
 }
 store();render();
 });
 phone.addEventListener('input',e=>{if(e.target.matches('[data-input=prompt]'))state.prompt=e.target.value;});
 phone.addEventListener('focusin',e=>{if(e.target.matches('[data-input=prompt]')&&state.shelf){state.shelf=false;const tiles=phone.querySelector('.lm-templates');if(tiles)tiles.hidden=true;const toggle=phone.querySelector('[data-action=shelf]');if(toggle)toggle.textContent='展开';}});
 let pointer=null;const touches=new Map();let pinch=null;
 const distance=()=>{const p=Array.from(touches.values());return p.length<2?0:Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);};
 phone.addEventListener('pointerdown',e=>{if(e.target.matches('[data-draggable]')){touches.set(e.pointerId,{x:e.clientX,y:e.clientY});pointer={id:e.pointerId,x:e.clientX,y:e.clientY,start:{...state.pan},node:e.target};e.target.setPointerCapture(e.pointerId);if(touches.size===2)pinch={distance:distance(),zoom:state.zoom};}});
 phone.addEventListener('pointermove',e=>{if(!pointer||!touches.has(e.pointerId))return;touches.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pinch&&touches.size===2){state.zoom=Math.max(.5,Math.min(2,pinch.zoom*distance()/Math.max(1,pinch.distance)));}else if(pointer.id===e.pointerId){state.pan={x:Math.max(-90,Math.min(90,pointer.start.x+e.clientX-pointer.x)),y:Math.max(-65,Math.min(65,pointer.start.y+e.clientY-pointer.y))};}pointer.node.style.transform=`translate(${state.pan.x}px,${state.pan.y}px) scale(${state.zoom})`;});
 const release=e=>{if(!touches.has(e.pointerId))return;touches.delete(e.pointerId);pinch=null;if(!touches.size){pointer=null;render();}};
 phone.addEventListener('pointerup',release);
 phone.addEventListener('pointercancel',release);
 render();
 if(globalThis.Tweak){const tweak=new Tweak({container:phone,onChange:()=>{phone.style.setProperty('--lm-radius',demo.radius+'px');state.shelf=demo.templatePanel;render();}});tweak.addSlider(demo,'radius',{label:'画布圆角',min:4,max:24,step:2,unit:'px'});tweak.addToggle(demo,'templatePanel',{label:'默认展开模板'});}
});
})();
