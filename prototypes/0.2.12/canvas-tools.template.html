const state={category:'stickers',filter:'all',template:null,phase:'ready',style:null,nodes:[],selected:null,draft:'',attachment:null,shelf:true,chatOpen:false,messages:[],zoom:1,pan:{x:0,y:0},output:'static',sheet:null,bad:false,toast:'',undo:null,workspaces:{},...(saved?.revision==='original-templates-v5'?saved.state:{})};
state.sheet=null;state.toast='';if(state.template==='text'){state.template=null;state.draft='';}let noticeTimer;
function save(){window.openai?.setWidgetState?.({modelContent:{prototype:'lightmao-0.2.12',scope:'second-tab-only',category:state.category,selectedTemplate:state.template,selectedStyle:state.style,stage:state.phase},privateContent:{revision:'original-templates-v5',sessionId,state:{...state,sheet:null,toast:'',undo:null}}}).catch(()=>{});}
function tell(s){state.toast=s;render();clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>{state.toast='';render();},2600);}
function message(role,text){state.messages.push({role,text});state.messages=state.messages.slice(-10);}
function selected(){return state.nodes.find(n=>n.id===state.selected);}
function groupSnapshot(){const {filter,template,phase,style,nodes,selected,draft,attachment,messages,zoom,pan,output}=state;return JSON.parse(JSON.stringify({filter,template,phase,style,nodes,selected,draft,attachment,messages,zoom,pan,output}));}
function renderNode(n,index){return `<article class="mc-node" data-node="${n.id}" data-selected="${state.selected===n.id}" style="left:${n.x}px;top:${n.y}px;width:${n.w}px;height:${n.h}px;z-index:${state.selected===n.id?10:index+1}"><div class="mc-nodehead" data-drag="${n.id}"><span>${n.type==='style'?'候选':n.type==='sample'?'样张':'产物'}</span><button data-action="delete" data-value="${n.id}" aria-label="删除${n.label}">${I('x')}</button></div>${n.image?`<img class="mc-node-art" src="${media[n.image]}" alt="${n.label}示意图" draggable="false">`:`<div class="mc-nodeblank">${I(n.type==='video'?'clapperboard':'type')}</div>`}<button class="mc-nodefoot" data-action="select" data-value="${n.id}" style="width:100%">${state.selected===n.id?I('check'):''}${E(n.label)}</button>${state.selected===n.id?`<button class="mc-resize" data-resize="${n.id}" aria-label="调整${n.label}大小"></button>`:''}</article>`;}
function primary(){if(state.category==='video'||state.template==='text')return '';if(state.phase==='styles')return `<button class="mc-primary" data-action="samples" ${state.style?'':'disabled'}>生成样张 · 360积分</button>`;if(state.phase==='samples')return `<button class="mc-primary" data-action="confirm">制作整套 · 2520积分</button>`;if(state.phase==='batch')return `<button class="mc-primary" data-action="finish">查看完成</button>`;if(state.phase==='complete')return `<button class="mc-primary" data-action="export">导出</button>`;return '';}
function chat(full=false){const msgs=full||state.chatOpen?state.messages:state.messages.slice(-2);return `<div class="mc-chat" role="log" aria-label="Agent对话记录">${msgs.map(m=>`<div class="mc-message ${m.role}">${full?`<span>${m.role==='user'?'你':'轻喵'}</span>`:''}${E(m.text)}</div>`).join('')}</div>`;}
function sheet(){if(!state.sheet)return '';let title='',content='';
if(state.sheet==='chat'){title='对话记录';content=chat(true);}
if(state.sheet==='reference'){title='角色图';content=`<div class="mc-switch"><button data-action="check" data-value="good" aria-pressed="${!state.bad}">清晰图</button><button data-action="check" data-value="bad" aria-pressed="${state.bad}">模糊图</button></div><div class="mc-check" ${state.bad?'role="alert"':''}>${state.bad?'人物太小，请换清晰角色图':'可以制作'}</div><button class="mc-primary" data-action="${state.bad?'replace':'attachimage'}">${state.bad?'重新上传':'使用此图'}</button>`;}
if(state.sheet==='attach'){title='添加';content=`<button class="mc-row" data-action="reference"><span>角色图</span>${I('image-plus')}</button><button class="mc-row" data-action="file"><span>文档</span>${I('file-text')}</button><button class="mc-row" data-action="material"><span>素材</span>${I('folder-open')}</button>`;}
if(state.sheet==='confirm'){title='继续制作';content=`<div class="mc-check">${state.style==='soft'?'柔彩':'萌系'} · 剩余21张</div><button class="mc-primary" data-action="batch">确认 · 2520积分</button>`;}
if(state.sheet==='export'){title='导出';content=`<button class="mc-row" data-action="exportdemo"><span>保存</span>${I('download')}</button><button class="mc-row" data-action="exportdemo"><span>分享</span>${I('share-2')}</button>`;}
if(state.sheet==='settings'){title='设置';content=`<label class="mc-row"><span>模型</span><select class="mc-select" aria-label="模型"><option>豆包</option><option>DeepSeek</option></select></label><button class="mc-row" data-action="reference"><span>换图</span>${I('image-plus')}</button>`;}
if(state.sheet==='projects'){title='项目';content=`<button class="mc-row" data-action="close"><span>日常表情</span>${I('arrow-up-right')}</button><button class="mc-row" data-action="new"><span>新建</span>${I('plus')}</button>`;}
if(state.sheet==='gallery'){title='模板';content='<div class="mc-gallery"></div>';}
return `<div class="mc-mask" data-action="dismiss"><section class="mc-sheet" role="dialog" aria-modal="true" aria-label="${title}"><div class="mc-sheethead">${title}<button class="mc-icon" data-action="close" aria-label="关闭">${I('x')}</button></div>${content}</section></div>`;}
function render(){const node=selected(),templates=Object.entries(defs).filter(([id,t])=>t.category===state.category&&(state.filter==='all'||t.group===state.filter));app.innerHTML=`<div class="mc-status"><span>9:41</span><span>交互原型</span></div><header class="mc-header">轻喵LightMao<div class="mc-capsule" aria-hidden="true">•••<span></span>◉</div></header><div class="mc-body"><aside class="mc-sidebar" aria-label="工具分类"><button class="mc-side" data-action="category" data-value="stickers" aria-pressed="${state.category==='stickers'}">${I('cat')}<span>表情</span></button><button class="mc-side" data-action="category" data-value="video" aria-pressed="${state.category==='video'}">${I('clapperboard')}<span>视频</span></button><button class="mc-side mc-history" data-action="projects" aria-label="项目">${I('panel-left')}</button></aside><main class="mc-main"><div class="mc-topbar"><span class="mc-title">${state.category==='stickers'?'表情画布':'视频画布'}</span><div class="mc-tools">${state.category==='stickers'?`<select class="mc-select" data-setting="output" aria-label="输出"><option value="static" ${state.output==='static'?'selected':''}>静态</option><option value="dynamic" ${state.output==='dynamic'?'selected':''}>动态</option></select>`:''}<button class="mc-icon" data-action="settings" aria-label="设置">${I('sliders-horizontal')}</button></div></div><div class="mc-workspace"><section class="mc-stage-wrap" aria-label="生成产物画布"><div class="mc-stage" data-pan="true"><div class="mc-scene" style="transform:translate(${state.pan.x}px,${state.pan.y}px) scale(${state.zoom})">${state.nodes.map(renderNode).join('')}</div>${!state.nodes.length?`<div class="mc-empty">${I(state.category==='stickers'?'image-plus':'clapperboard')}<span>${state.category==='stickers'?'选模板，开始创作':'添加你的素材'}</span></div>`:''}</div><div class="mc-viewtools"><div class="mc-tools"><button class="mc-icon" data-action="out" aria-label="缩小画布">−</button><span>${Math.round(state.zoom*100)}%</span><button class="mc-icon" data-action="in" aria-label="放大画布">＋</button><button class="mc-icon" data-action="fit" aria-label="适应画布">${I('maximize')}</button></div><div class="mc-tools"><button class="mc-icon" data-action="attach" aria-label="添加素材">${I('plus')}</button><button class="mc-icon" data-action="chat" aria-label="展开对话记录">${I('messages-square')}</button></div></div></section><section class="mc-agent" aria-label="轻喵Agent"><div class="mc-agenthead"><span>${I('cat')}轻喵</span><button class="mc-icon" data-action="chat" aria-label="查看全部对话">${I('expand')}</button></div>${chat()}${primary()?`<div class="mc-agentaction">${primary()}</div>`:''}</section></div><div class="mc-compose"><div class="mc-context"><span>${node?'选中 '+E(node.label):defs[state.template]?.name||'制作要求'}</span>${state.attachment?`<button data-action="reference">${I('paperclip')}${E(state.attachment)}</button>`:''}${state.phase==='ready'&&state.template==='lightmao'?'<span>· 240积分</span>':''}</div><div class="mc-inputrow"><button class="mc-icon" data-action="attach" aria-label="添加">${I('plus')}</button><textarea class="mc-input" maxlength="1000" aria-label="输入制作要求" placeholder="输入要求…">${E(state.draft)}</textarea><button class="mc-send" data-action="send" aria-label="发送" ${state.draft.trim()?'':'disabled'}>${I('arrow-up')}</button></div></div><section class="mc-shelf" aria-label="模板"><div class="mc-shelfhead"><span>模板</span>${state.category==='video'&&state.shelf?`<div class="mc-filters">${[['all','全部'],['edit','剪辑'],['explain','图解'],['talk','口播']].map(([id,n])=>`<button data-action="filter" data-value="${id}" aria-pressed="${state.filter===id}">${n}</button>`).join('')}</div>`:''}<button class="mc-icon" data-action="shelf" aria-label="${state.shelf?'收起模板':'展开模板'}">${I(state.shelf?'chevron-down':'chevron-up')}</button></div>${state.shelf?`<div class="mc-templates">${templates.map(([id,t])=>`<button class="mc-template" data-action="template" data-value="${id}" aria-pressed="${state.template===id}">${I(t.icon)}<span>${t.name}</span></button>`).join('')}</div>`:''}</section></main></div><nav class="mc-tabbar" aria-label="原版导航">${[['create','创作'],['idea','工具'],['library','资源'],['profile','我的']].map(([id,n])=>`<button class="mc-tab" data-action="original-tab" data-value="${id}" ${id==='idea'?'aria-current="page"':''}><img src="${media['tab-'+id]}" alt=""><span>${n}</span></button>`).join('')}</nav><div class="mc-homebar"></div>${sheet()}${state.toast?`<div class="mc-toast" role="status">${E(state.toast)}${state.undo?'<button data-action="undo">撤销</button>':''}</div>`:''}`;if(globalThis.lucide)lucide.createIcons({attrs:{width:18,height:18}});}
function previewFor(id){const box=document.createElement('span');box.className='mc-template-preview';const img=(key)=>{const n=document.createElement('img');n.src=media[key];n.alt='模板例图';n.draggable=false;return n;};
if(id==='lightmao'){box.classList.add('mc-original','mc-original-stickers');box.append(img('template-lightmao-01'));}
else if(media['template-'+id]){box.classList.add('mc-original');box.append(img('template-'+id));}
return box;}
function decorateTemplates(){const agent=app.querySelector('.mc-agent'),action=agent?.querySelector('.mc-agentaction');if(action){action.className='mc-stageaction';app.querySelector('.mc-workspace').append(action);}agent?.remove();const gallery=app.querySelector('.mc-gallery');if(gallery)Object.entries(defs).filter(([id,t])=>t.category===state.category&&(state.filter==='all'||t.group===state.filter)).forEach(([id,t])=>{const b=document.createElement('button');b.className='mc-template';b.dataset.action='template';b.dataset.value=id;b.setAttribute('aria-pressed',String(state.template===id));const name=document.createElement('span');name.textContent=t.name;b.append(name);gallery.append(b);});
app.querySelectorAll('.mc-template').forEach(b=>{b.querySelector('svg,i')?.remove();b.prepend(previewFor(b.dataset.value));});
const head=app.querySelector('.mc-shelfhead');if(head&&state.shelf){const b=document.createElement('button');b.className='mc-gallery-button';b.dataset.action='gallery';b.textContent='展开';b.setAttribute('aria-label','展开模板例图');head.insertBefore(b,head.lastElementChild);}app.querySelectorAll('[data-action="filter"]').forEach(b=>{if(b.dataset.value==='edit')b.textContent='界面';if(b.dataset.value==='talk')b.textContent='产品';});}
const baseRender=render;render=()=>{if(state.template&&state.draft===legacyVideoPrompts[state.template])state.draft=defs[state.template].prompt;baseRender();decorateTemplates();};
app.addEventListener('click',e=>{if(state.sheet==='gallery'&&e.target.closest('[data-action="template"]'))state.sheet=null;},{capture:true});
function send(){const text=state.draft.trim();if(!text)return;message('user',text);state.draft='';if(state.category==='video'){message('assistant',state.attachment==='视频素材'?'素材已收到，可以开始剪辑。':'先添加素材。');state.phase='ready';}
else if(state.template==='text'){state.nodes.push({id:'text-'+Date.now(),label:'文字表情',type:'text',x:30,y:35,w:155,h:160});message('assistant','文字表情已放入画布。');state.phase='complete';}
else if(state.phase==='ready'||!state.nodes.length){if(!state.attachment){message('assistant','先加一张角色图。');}else{state.nodes=initialNodes();state.phase='styles';state.style=null;state.selected=null;message('assistant','两种画风，你选哪种？');}}
else{message('assistant',selected()?'收到，调整「'+selected().label+'」。':'收到，按这个要求调整。');}save();render();}
app.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,v=b.dataset.value;if(a==='dismiss'&&e.target!==b)return;
switch(a){
case 'category':if(v===state.category)return;state.workspaces[state.category]=groupSnapshot();state.category=v;Object.assign(state,state.workspaces[v]||{filter:'all',template:null,phase:'ready',style:null,nodes:[],selected:null,draft:'',attachment:null,messages:[],zoom:1,pan:{x:0,y:0},output:'static'});break;
case 'template':state.template=v;state.draft=defs[v].prompt;break;
case 'filter':state.filter=v;break;
case 'select':state.selected=v;{const n=selected();if(n?.type==='style'){state.style=n.id;message('assistant','选用'+n.label+'，整套保持一致。');}}break;
case 'delete':{const idx=state.nodes.findIndex(n=>n.id===v);if(idx<0)return;state.undo={node:{...state.nodes[idx]},idx,style:state.style};state.nodes.splice(idx,1);if(state.selected===v)state.selected=null;if(state.style===v)state.style=null;save();return tell('已移出画布');}
case 'undo':if(state.undo){state.nodes.splice(state.undo.idx,0,state.undo.node);state.style=state.undo.style;state.undo=null;state.toast='';}break;
case 'samples':if(!state.style)return;state.phase='samples';state.nodes=[['贴贴','sample0'],['摸头','sample1'],['心动','sample2']].map(([label,image],i)=>({id:'sample-'+i,label,image:state.style==='soft'?image:'round',type:'sample',x:12+i*78,y:8+i*20,w:108,h:150}));state.selected='sample-0';message('assistant','3张样张好了，看看？');break;
case 'confirm':case 'chat':case 'attach':case 'reference':case 'settings':case 'projects':case 'export':case 'gallery':state.sheet=a;break;
case 'dismiss':case 'close':state.sheet=null;break;
case 'check':state.bad=v==='bad';break;
case 'replace':state.bad=false;return tell('已换示例图');
case 'attachimage':state.attachment='角色图';state.sheet=null;break;
case 'file':state.attachment='文档';state.sheet=null;break;
case 'material':state.attachment=state.category==='video'?'视频素材':'角色图';state.sheet=null;break;
case 'new':state.nodes=[];state.selected=null;state.style=null;state.phase='ready';state.template=null;state.draft='';state.messages=[];state.sheet=null;break;
case 'send':return send();
case 'batch':state.phase='batch';state.sheet=null;message('assistant','沿用选定画风，继续剩余21张。');break;
case 'finish':state.phase='complete';message('assistant','整套完成，可以导出。');break;
case 'in':state.zoom=Math.min(1.75,state.zoom+.25);break;
case 'out':state.zoom=Math.max(.5,state.zoom-.25);break;
case 'fit':state.zoom=1;state.pan={x:0,y:0};break;
case 'shelf':state.shelf=!state.shelf;break;
case 'exportdemo':return tell('导出演示');
case 'original-tab':if(v!=='idea')return tell('沿用原版');break;
}save();render();});
app.addEventListener('input',e=>{if(e.target.matches('.mc-input')){state.draft=e.target.value;const b=app.querySelector('[data-action="send"]');if(b)b.disabled=!state.draft.trim();}});
app.addEventListener('change',e=>{if(e.target.dataset.setting==='output'){state.output=e.target.value;save();}});
let gesture=null,pinch=null,suppressClick=false;const pointers=new Map();
const distance=()=>{const p=[...pointers.values()];return p.length===2?Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y):0;};
app.addEventListener('pointerdown',e=>{const stage=e.target.closest('.mc-stage');if(!stage||e.target.closest('[data-action]'))return;const nodeElement=e.target.closest('[data-node]'),n=nodeElement?state.nodes.find(n=>n.id===nodeElement.dataset.node):null;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});stage.setPointerCapture(e.pointerId);gesture={id:e.pointerId,x:e.clientX,y:e.clientY,mode:e.target.dataset.resize?'resize':n?'node':'pan',node:n,start:n?{x:n.x,y:n.y,w:n.w,h:n.h}:{...state.pan},stage,moved:false};if(pointers.size===2)pinch={distance:distance(),zoom:state.zoom};});
app.addEventListener('pointermove',e=>{if(!gesture||!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});const dx=e.clientX-gesture.x,dy=e.clientY-gesture.y;gesture.moved=gesture.moved||Math.abs(dx)+Math.abs(dy)>3;
if(pinch&&pointers.size===2){state.zoom=Math.max(.5,Math.min(1.75,pinch.zoom*distance()/Math.max(1,pinch.distance)));}
else if(gesture.mode==='node'){const n=gesture.node;n.x=Math.max(0,Math.min(gesture.stage.clientWidth/state.zoom-n.w,gesture.start.x+dx/state.zoom));n.y=Math.max(0,Math.min(gesture.stage.clientHeight/state.zoom-n.h,gesture.start.y+dy/state.zoom));const el=app.querySelector('[data-node="'+n.id+'"]');if(el){el.style.left=n.x+'px';el.style.top=n.y+'px';}}
else if(gesture.mode==='resize'){const n=gesture.node;n.w=Math.max(88,Math.min(180,gesture.start.w+dx/state.zoom));n.h=Math.max(140,Math.min(265,gesture.start.h+dy/state.zoom));const el=app.querySelector('[data-node="'+n.id+'"]');if(el){el.style.width=n.w+'px';el.style.height=n.h+'px';}}
else state.pan={x:Math.max(-100,Math.min(100,gesture.start.x+dx)),y:Math.max(-90,Math.min(90,gesture.start.y+dy))};const scene=app.querySelector('.mc-scene');if(scene)scene.style.transform=`translate(${state.pan.x}px,${state.pan.y}px) scale(${state.zoom})`;});
function release(e){if(!pointers.has(e.pointerId)||!gesture)return;pointers.delete(e.pointerId);pinch=null;if(!pointers.size){if(gesture.node&&!gesture.moved){state.selected=gesture.node.id;if(gesture.node.type==='style'){state.style=gesture.node.id;message('assistant','选用'+gesture.node.label+'，整套保持一致。');}}gesture=null;save();render();}}
app.addEventListener('pointerup',release);app.addEventListener('pointercancel',release);
let lastWidth=0;
new ResizeObserver(()=>{const width=Math.round(app.clientWidth);if(width===lastWidth)return;lastWidth=width;const stage=app.querySelector('.mc-stage');if(!stage)return;state.nodes.forEach(n=>{n.w=Math.min(n.w,Math.max(88,stage.clientWidth-16));n.x=Math.max(8,Math.min(n.x,stage.clientWidth-n.w-8));n.y=Math.max(6,Math.min(n.y,stage.clientHeight-n.h-6));});render();}).observe(app);
window.addEventListener('openai:set_globals',e=>{const s=e.detail?.globals?.widgetState?.privateContent;if(s?.revision==='original-templates-v5'&&s.sessionId!==sessionId){Object.assign(state,s.state,{sheet:null,toast:''});render();}});
render();
if(globalThis.Tweak){const design={templates:true};const tweak=new Tweak({container:app,onChange:()=>{state.shelf=design.templates;render();}});tweak.addToggle(design,'templates',{label:'展开模板'});}
})();
</script>
