# Install inside nginx's http context, after the shared-data cutover has passed.
# Translate only the legitimate old H5 origin. Foreign origins stay foreign so
# the API's mutation guard continues to reject them.
map $http_origin $qingjian_shared_origin {
    default $http_origin;
    "https://video.shikanon.com" "https://video.tensorbytes.com";
}

server {
    listen 80;
    server_name video.shikanon.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 308 https://video.shikanon.com$request_uri; }
}

server {
    listen 443 ssl;
    server_name video.shikanon.com;
    ssl_certificate /etc/letsencrypt/live/video.shikanon.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/video.shikanon.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1g;

    location / {
        proxy_pass https://video.tensorbytes.com;
        proxy_ssl_server_name on;
        proxy_ssl_name video.tensorbytes.com;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_set_header Host video.tensorbytes.com;
        proxy_set_header Origin $qingjian_shared_origin;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_http_version 1.1;
    }
}
