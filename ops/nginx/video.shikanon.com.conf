server {
    listen 80;
    server_name video.shikanon.com;

    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 308 https://video.shikanon.com$request_uri; }
}

server {
    listen 443 ssl;
    server_name video.shikanon.com;

    ssl_certificate /etc/letsencrypt/live/video.shikanon.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/video.shikanon.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    auth_basic "Qingjian preview";
    auth_basic_user_file /etc/nginx/.qingjian-htpasswd;
    client_max_body_size 1g;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    location = / {
        proxy_pass http://127.0.0.1:8787/qingjian/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 300s;
        proxy_http_version 1.1;
    }
    location = /qingjian { return 308 /qingjian/; }
    location ^~ /qingjian/api/admin/ {
        auth_basic off;
        proxy_pass http://127.0.0.1:8787/api/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 300s;
    }
    location ^~ /qingjian/ {
        proxy_pass http://127.0.0.1:8787/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 300s;
        proxy_http_version 1.1;
    }
    location / { return 404; }
}
